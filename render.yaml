services:
  - type: web
    name: boatrace-ai
    env: node
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pip3 install requests beautifulsoup4 lxml pandas scikit-learn lightgbm xgboost joblib && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
